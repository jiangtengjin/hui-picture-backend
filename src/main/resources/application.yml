server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 配置
    session:
      cookie:
        # cookie 30 天过期
        max-age: 2592000
spring:
  application:
    name: hui-picture-backend
  # 配置文件
  profiles:
    active: local
  #  数据库配置
  datasource:
    url: jdbc:mysql://192.168.179.127:3306/yu_picture
    username: root
    password: 123
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 配置
  redis:
    database: 0
    host: 192.168.179.127
    port: 6379
    timeout: 5000
  # session 配置
  session:
    store-type: redis
    # session 30天过期
    timeout: 2592000
  #  最大文件上传大小
  servlet:
    multipart:
      max-file-size: 10MB
  # 空间图片分表
  shardingsphere:
    datasource:
      names: yu_picture
      yu_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://192.168.179.127:3306/yu_picture
        username: root
        password: 123
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: yu_picture.picture  # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.xhh.yupicturebackend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true

#  生效的配置文件
#  profiles:
#    active: local
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
    enable-sql-runner: true # 要想使用 mybatis-plus的 SqlRunner，必须开启这个配置
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.xhh.yupicturebackend.controller
